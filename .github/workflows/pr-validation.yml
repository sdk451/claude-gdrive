name: pr-validation

# PR validation: install, typecheck, eslint, unit tests (+ JSON/JUnit reports),
# markdown lint, targeted story tests (from branch name), human-readable summary
# artifact tied to PR + story id.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: install / typecheck / lint / test / lint:md / targeted
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ["22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve story id from head branch
        id: story
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="${HEAD_REF:-unknown}"
          if [[ "$ref" =~ ([A-Z]+-[0-9]+) ]]; then
            sid="${BASH_REMATCH[1]}"
            echo "story_id=${sid}" >> "$GITHUB_OUTPUT"
            echo "targets_file=docs/tests/${sid}-targets.txt" >> "$GITHUB_OUTPUT"
          else
            echo "story_id=unknown" >> "$GITHUB_OUTPUT"
            echo "targets_file=" >> "$GITHUB_OUTPUT"
          fi
          echo "head_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SDLC TOOLING SELF-CHECK
      #
      # The scripts under scripts/ orchestrate the agent loop: regression scoping,
      # the local CI gate, worktree lifecycle. Nothing else in CI executes them -
      # this workflow calls npm run test:unit and friends directly - so a runtime
      # error in the tooling is invisible here while breaking every agent run.
      #
      # That is exactly what happened: run-all-tests.cjs carried a ReferenceError
      # that killed every regression run in eleven repos while CI stayed green,
      # because `node --check` validates syntax and CI never ran the file.
      #
      # Fast, hermetic, no network.
      - name: SDLC tooling self-check
        run: node --test "scripts/test/**/*.test.cjs"
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Markdown)
        run: pnpm lint:md

      - name: Test (unit) with JSON + JUnit reports
        run: |
          mkdir -p reports
          pnpm run test:unit:ci

      - name: Targeted tests (story targets file)
        shell: bash
        run: |
          mkdir -p reports
          T="${{ steps.story.outputs.targets_file }}"
          if [[ -n "$T" && -f "$T" ]]; then
            echo "Running targeted suite: $T"
            bash scripts/run-targeted-tests.sh "$T" 2>&1 | tee reports/targeted-tests.log
          else
            echo "No targets file for branch (story_id=${{ steps.story.outputs.story_id }}). Skipping targeted step."
            echo "(No targeted run — branch name has no TOK-123-style id or file missing.)" > reports/targeted-tests.log
          fi

      - name: Fetch Linear issue description (optional)
        if: always()
        shell: bash
        env:
          STORY_ID: ${{ steps.story.outputs.story_id }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/ci/fetch-linear-issue.mjs

      - name: Write human-readable test summary
        if: always()
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.head_ref }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/write-test-result-summary.mjs

      - name: Append run record (JSONL)
        if: always()
        shell: bash
        run: node scripts/ci/append-test-run-log.mjs

      - name: Upload test reports artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-pr-${{ github.event.pull_request.number }}-${{ steps.story.outputs.story_id }}
          path: |
            reports/STORY_TEST_SUMMARY.md
            reports/test-run-record.json
            reports/linear-issue.json
            reports/vitest-unit.json
            reports/vitest-unit-junit.xml
            reports/targeted-tests.log
            docs/test-runs/test-runs.jsonl
          if-no-files-found: warn
