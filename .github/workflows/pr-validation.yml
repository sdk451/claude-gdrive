name: pr-validation

# PR validation: install, typecheck, eslint, unit tests, markdown lint,
# targeted-test runner (TOK-7 / S0.2). Concurrency cancels superseded runs.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: install / typecheck / lint / test / lint:md / targeted
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ["22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Markdown)
        run: pnpm lint:md

      - name: Test (unit)
        run: pnpm test

      - name: Targeted tests (TOK-7)
        run: bash scripts/run-targeted-tests.sh docs/tests/TOK-7-targets.txt
