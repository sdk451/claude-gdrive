name: pr-validation

# Minimal scaffold from TOK-6 / S0.1.
# TOK-7 / S0.2 extends this with: targeted-test runner, markdown lint,
# concurrency cancellation, and the required-status-check rule.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: install / typecheck / lint / test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ["22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit)
        run: pnpm test
