# Main-line CI: full regression + container image.
# Push: runs tests, builds Docker image; pushes to Artifact Registry when GCP secrets are configured.

name: ci

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: full regression (unit + story target files)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ["22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Markdown)
        run: pnpm lint:md

      - name: Default Vitest suite + reports
        run: |
          mkdir -p reports
          pnpm run test:unit:ci

      - name: Story targets regression (all TOK-*-targets.txt)
        shell: bash
        run: bash scripts/ci/run-regression-story-targets.sh

      - name: Write regression summary
        if: always()
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/ci/write-test-result-summary.mjs

      - name: Upload regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-main-${{ github.sha }}
          path: |
            reports/MAIN_REGRESSION_SUMMARY.md
            reports/vitest-unit.json
            reports/vitest-unit-junit.xml
            reports/regression-story-targets.log
            reports/targeted-tests.log
          if-no-files-found: warn

  container:
    name: docker build (push to Artifact Registry when configured)
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      LOCAL_IMAGE: gdrive-mcp:build-${{ github.sha }}
      # Secrets are not allowed in step `if:`; expose as job env for gating + inputs.
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t "$LOCAL_IMAGE" .

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && env.GCP_ARTIFACT_REGISTRY != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.auth.outcome == 'success'
        shell: bash
        env:
          GCP_ARTIFACT_REGISTRY: ${{ env.GCP_ARTIFACT_REGISTRY }}
        run: |
          set -euo pipefail
          host="${GCP_ARTIFACT_REGISTRY%%/*}"
          gcloud auth configure-docker "$host" -q

      - name: Tag and push image (commit SHA)
        if: steps.auth.outcome == 'success'
        shell: bash
        env:
          GCP_ARTIFACT_REGISTRY: ${{ env.GCP_ARTIFACT_REGISTRY }}
        run: |
          set -euo pipefail
          remote="${GCP_ARTIFACT_REGISTRY}:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$remote"
          docker push "$remote"
          echo "Pushed ${remote}"

      - name: Push skipped (no GCP secrets)
        if: steps.auth.outcome != 'success'
        run: |
          echo "GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT / GCP_ARTIFACT_REGISTRY not set."
          echo "Image built locally as $LOCAL_IMAGE only. See README → CI / Artifact Registry."
