name: security

on:
  pull_request_target:
    branches: [main]
  schedule:
    # Weekly, Monday 02:30 UTC
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  npm_audit:
    name: pnpm audit (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high+)
        run: pnpm audit --audit-level=high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run gitleaks (CLI)
        shell: bash
        run: |
          set -euo pipefail
          # Use the CLI directly so it works for pull_request_target.
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --redact -v --exit-code 2

  trivy_fs:
    name: trivy fs (high/critical gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Trivy filesystem scan
        # Pin to a known-safe release tag (post-2026-03 supply chain incident guidance).
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

